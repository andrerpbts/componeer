# Pages of the bundled documentation (/componeer), in sidebar order.
# Each section may have a heading, text (blank line = new paragraph, `code` in backticks),
# a code block, and an example (a partial in app/views/componeer/docs/examples).

- slug: getting_started
  title: Getting started
  group: Guides
  lead: Trail UI for Rails views, written as helpers that nest.
  sections:
    - text: |
        Componeer renders the Trail UI design system in Rails. Every component is a ViewComponent class exposed as a view helper, so a screen is a tree of helper calls: `page_header`, `card`, `table`, `button`… Each helper takes options and, when it holds content, a block.

        Trail UI itself (tokens, rules, previews) lives in its design system artifact. This gem is its Rails implementation: the CSS here is generated from it, and component changes start there.
    - heading: Install
      text: Componeer is not on RubyGems.org yet. Add it from git and bundle.
      language: ruby
      code: |
        # Gemfile
        gem "componeer", git: "https://github.com/andrerpbts/componeer.git"
    - heading: Stylesheets
      text: Load the tokens and the component styles in your layout, and put `tr-root` on the body for the base font and colours.
      language: erb
      code: |
        <head>
          <%= componeer_stylesheets %>
        </head>
        <body class="tr-root">
    - heading: JavaScript
      text: |
        Popovers, the multi-select, the period picker, row links and dismissable overlays use Stimulus. With importmap-rails and stimulus-rails, the engine pins its controllers for you; register them once.

        Without importmap, copy `app/javascript/componeer` into your bundle and import it the same way.
      language: javascript
      code: |
        // app/javascript/controllers/index.js
        import { application } from "controllers/application"
        import { registerComponeer } from "componeer"
        registerComponeer(application)
    - heading: Documentation
      text: Mount the engine to browse these pages inside your own app, with your own data and layout around them. Mount it only where you want it, for example in development.
      language: ruby
      code: |
        # config/routes.rb
        mount Componeer::Engine => "/componeer" if Rails.env.development?

- slug: composition
  title: Composing screens
  group: Guides
  lead: "Blocks inside blocks: helpers take blocks, and blocks call more helpers."
  sections:
    - text: |
        A helper with a block renders its component around whatever the block outputs. Inside the block you write normal ERB, including other Componeer helpers, partials or your own markup. That is how screens are built: a `stack` of `card`s, a `card` holding a `table`, a `table` cell holding a `status_pill`.
      example: composition
    - heading: Slots
      text: |
        Some components have named areas besides their main content: a card's `actions` and `footer`, a page header's `filters` and `tabs`. The block receives the component; call `with_<slot>` on it to fill a slot. A slot's block can itself call helpers.

        Slots that hold a single helper read well as one-liners: `header.with_action { button "Sincronizar", variant: :primary }`.
      example: card
    - heading: Layout blocks
      text: "`stack` piles blocks vertically with a 16px gap; `cluster` lines up inline items that wrap. Both take `gap:` and any HTML attribute."
      example: stack_cluster

- slug: custom_components
  title: Your own components
  group: Guides
  lead: Register an app component and it becomes a helper too.
  sections:
    - text: |
        Build app-specific blocks the same way: a ViewComponent (subclassing `Componeer::BaseComponent` gives you `html_attributes`, `icon_svg` and `option!`) whose template uses Componeer helpers. Keep the markup in the template and the logic in the class. Register it in an initializer and call it like any built-in.

        A name that would override an Action View helper (`select`, `label`, `search_field`…) is refused at boot.
      language: ruby
      code: |
        # app/components/quest_card_component.rb
        class QuestCardComponent < Componeer::BaseComponent
          def initialize(quest:)
            @quest = quest
          end
        end
    - language: erb
      code: |
        <%# app/components/quest_card_component.html.erb %>
        <%= card(title: @quest.title, subtitle: @quest.project.name) do |c| %>
          <% c.with_action { status_pill @quest.status_label, status: :accent } %>
          <%= content %>
        <% end %>
    - language: ruby
      code: |
        # config/initializers/componeer.rb
        Componeer.register :quest_card, "QuestCardComponent"
    - language: erb
      code: |
        <%# any view %>
        <%= quest_card(quest: @quest) do %>
          <%= render @quest.missions %>
        <% end %>
    - heading: Extra icons
      text: Point Componeer at folders of your own SVGs. They are looked up before the bundled Tabler set, so `icon "logo"` finds `app/assets/icons/logo.svg`.
      language: ruby
      code: |
        Componeer.configure do |config|
          config.icon_paths << Rails.root.join("app/assets/icons")
        end

- slug: screens
  title: Example screens
  group: Guides
  lead: Whole screens built only from Componeer helpers, to see how the pieces look together.
  sections:
    - heading: List with detail
      text: "The everyday screen: filter a list, open a record beside it. App shell with a test-environment banner, a page header with actions, search, period and company filters and tabs, a table grouped by month, and the drawer of the current row."
      screen: notes
    - heading: Dashboard
      text: Cards that answer "what now?" at a glance. A Day / Week / Month switch in the header, a warning callout, cards holding flush tables and a side card. Status colours only where something needs attention.
      screen: agenda
    - heading: Settings form
      text: Fields grouped in cards, one primary action at the end. Text, select, read-only and invalid fields, switches and radios, a destructive zone, a warning with its action, and the toast that confirms the save.
      screen: settings
    - heading: List with confirmation
      text: A destructive action confirmed in a modal over the list. Tabs with counts, a grouped table with progress and late markers, and the modal that names exactly what will happen.
      screen: quests

- slug: theming
  title: Theming
  group: Guides
  lead: Change Trail UI's variables to give an app its own colours, corners and density.
  sections:
    - text: |
        Every colour, radius, spacing step and control size is a CSS custom property defined by `componeer/tokens.css`, and every component reads them with `var(--…)`. To theme an app, redefine the variables you want in a stylesheet loaded after Componeer's. Nothing else changes: the same helpers render in the new look.
    - heading: 1. Create a theme stylesheet
      text: Redefine only what changes. For a new brand colour, change the accent family together so hovers, selected rows and open triggers stay coherent.
      language: css
      code: |
        /* app/assets/stylesheets/theme.css */
        :root {
          --accent: #6d28d9;        /* primary buttons, links, current tab */
          --accent-dark: #5b21b6;   /* primary border and hover */
          --accent-soft: #f3effd;   /* selected rows, current preset */
          --accent-wash: #f7f4fe;   /* open trigger background */
          --accent-chip: #ebe4fc;   /* count chip on the active tab */
          --check: #7c3aed;         /* checked checkboxes and radios */

          --radius: 6px;            /* buttons, inputs */
          --radius-xl: 10px;        /* popovers, dialogs */
        }
    - heading: 2. Load it after Componeer
      language: erb
      code: |
        <%# app/views/layouts/application.html.erb %>
        <%= componeer_stylesheets %>
        <%= stylesheet_link_tag "theme" %>
    - heading: Result
      text: |
        The same block rendered three times; only the variables on its wrapper change. A theme can also be scoped to part of a page by setting the variables on an element instead of `:root`.

        Keep contrast when you pick colours: text on `accent` is white (`on-accent`), so the accent needs at least 4.5:1 against white, and `accent` text on `accent-soft` needs the same. Variables defined as another variable (`--toast: var(--ink)`) are resolved where they are declared, so override those too when you change their source at a lower level than `:root`.
      example: theming
    - heading: All variables
      text: Defaults are Trail UI's light theme. Changes to the defaults themselves belong in the Trail UI design system, then in a new Componeer release.
      gallery: tokens

- slug: foundations
  title: Foundations
  group: Guides
  lead: Tokens, type and the rules every screen follows.
  sections:
    - text: |
        Colours, type, spacing, radii and sizes are CSS custom properties from `componeer/tokens.css` (`var(--ink)`, `var(--accent)`, `var(--space-20)`, `var(--control-h)`…). Use them for anything you style yourself; never hard-code a hex value next to Componeer.

        Pages are `surface` with `ink` text. `accent` marks what is active or primary and is used sparingly. Status colours (`ok`, `warn`, `bad`) are separate from the accent and always come with a word. Regions are separated by 1px lines, not shadows; only what floats (popovers, drawer, modal, toasts) has a shadow.

        Copy is pt-BR, sentence case, verb-first on buttons ("Sincronizar", "Exportar filtro…"). Numbers and dates in pt-BR ("1.204", "R$ 1.500,00", "07/11/2026").

        With Tailwind in the same app, keep Tailwind for layout if you like, but take colours, type, radii and component looks from Componeer.

- slug: icon
  title: Icon
  group: Foundations
  lead: The whole Tabler set (3.19, outline and filled), inlined so icons take the text colour.
  helper: |
    icon(
      name,
      size: 16,
      variant: :outline,  # or :filled
      label: nil,         # accessible name; omit for decorative icons
      **html
    )
  sections:
    - text: Use the Tabler name (`file-text`, `alert-triangle`; underscores work too). Icons are decorative and hidden from screen readers unless you pass `label:`. Buttons take `icon:` directly.
      example: icons
    - heading: All icons
      text: Every Tabler icon ships with the gem, outline and filled. Search the set and click an icon to copy its helper call.
      gallery: icons
  options:
    - [name, "Tabler icon name, or the name of an SVG in a configured icon path."]
    - [variant, ":outline (default, stroked) or :filled (solid; fewer icons have it)."]
    - [size, "Pixels. 16 in controls, 14 for chevrons, 20 at most elsewhere."]
    - [label, "Accessible name; makes the icon role=img instead of hidden."]

- slug: button
  title: Button
  group: Actions
  lead: Every action, with one modifier for its role.
  helper: |
    button(
      label = nil,        # or a block with custom content
      variant: :default,  # :primary, :danger, :danger_fill, :ghost
      size: :md,          # or :sm
      icon: nil,
      href: nil,          # renders a link instead of a <button>
      type: "button",
      **html
    )

    icon_button(icon, label:, variant: :ghost, href: nil, **html)
  sections:
    - text: "`primary` is the one action the page exists for, at most once per view. `danger` marks destructive actions that still confirm; `danger_fill` is only the confirming button inside a modal. With `href:` it renders a link. Pass a block instead of `label` for custom content."
      example: button_variants
    - heading: Small and icon-only
      text: "Use `size: :sm` in toolbars, footers and panels. `icon_button` is a 30px square that needs a `label:` for screen readers."
      example: button_sizes
  options:
    - [variant, ":default, :primary, :danger, :danger_fill, :ghost"]
    - [size, ":md (34px) or :sm (30px)"]
    - [icon, "Tabler icon shown before the label"]
    - [href, "Render an <a> instead of a <button>; data-turbo-method etc. go in **html"]
    - [type, "Button type when not a link: button (default) or submit"]

- slug: segmented
  title: Segmented
  group: Actions
  lead: Switch between 2–4 views of the same data.
  helper: |
    segmented(label:) do |views|
      views.with_item(label, href: nil, pressed: false, value: nil)
    end
  sections:
    - text: "Without `href:` the items are buttons that switch on the page and dispatch `componeer--segmented:change` with the chosen `value` (first row). With `href:` each item is a link and the current one gets aria-current (second row): use that when each view has its own URL. For filters use a multi-select; for record subsets with counts use tabs."
      example: segmented

- slug: field
  title: Fields
  group: Forms
  lead: Inputs, selects, checkboxes and the search field, all 34px to line up with buttons.
  helper: |
    field(label, hint: nil, error: nil) do
      # the control: text_field_tag, f.select… with class "tr-input" / "tr-select"
    end

    search_input(name: :q, value: nil, placeholder: "Buscar", label: nil, **html)
  sections:
    - text: "`field` wraps any control with its label and a hint or error. Style the control with `tr-input`, `tr-select` or `tr-check` (also through form builders: `f.text_field :name, class: \"tr-input\"`). `search_input` is the search box with its icon; in a page header's filters row it grows to fill the row."
      example: field
    - heading: Read-only and disabled
      text: "Read-only (`readonly: true`) keeps a white field with a lighter border: the value reads and copies normally but cannot change. Disabled (`disabled: true`) is greyed out with muted text and a not-allowed cursor, and its label turns muted too. Say in the hint why a field is disabled and what unlocks it."
      example: field_disabled
  options:
    - [label, "Text before the control"]
    - [hint, "Muted help line under the control"]
    - [error, "Error line under the control; also set aria-invalid on the control"]

- slug: toggle_switch
  title: Switch
  group: Forms
  lead: An on/off setting that applies right away.
  helper: |
    toggle_switch(
      name,
      label:,
      checked: false,
      value: "1",
      **html
    )
  sections:
    - text: It is a real checkbox with role=switch, so it submits with forms. When the change is only saved with the form, prefer a plain checkbox.
      example: toggle_switch

- slug: status
  title: Status
  group: Status
  lead: Dots, pills, counters and badges.
  helper: |
    status_dot(status = :neutral, color: nil)        # :ok, :warn, :bad, :neutral
    status_pill(label, status: :ok, dot: true)        # :ok, :bad, :neutral, :accent, :warn
    counter(number)
    badge(text)
  sections:
    - text: "`status_dot` (:ok, :warn, :bad, :neutral, or `color:` for a project colour) sits before a status word in lists; never alone. `status_pill` shows one record's state in a header (:ok, :bad, :neutral, :accent, :warn). `counter` is the number behind a tab or option, with the locale's thousands separator. `badge` is a \"+N\" on a button."
      example: status

- slug: callout
  title: Callout
  group: Status
  lead: Inline messages inside a page or panel.
  helper: |
    callout(
      text = nil,
      variant: :info,     # :ok, :warning
      icon: nil
    ) do |c|
      c.with_action { … }  # :warning only
    end
  sections:
    - text: ":info informs, :ok confirms, :warning asks the person to act and may hold one small action. One sentence saying what happened and what to do."
      example: callout

- slug: app_shell
  title: App shell
  group: Layout
  lead: The frame of every screen.
  helper: |
    app_shell do |shell|
      shell.with_banner(text, kind: :test)  # or :sandbox
      shell.with_sidebar(brand:, brand_href: "/") do |sidebar|
        sidebar.with_brand_logo { … }
        sidebar.with_item(label, href:, icon: nil, current: nil)
        sidebar.with_heading(text)
        sidebar.with_footer { … }
      end
      # page content
    end
  sections:
    - text: |
        Use it once, in the application layout, around `yield`. The banner names any environment that is not the real one (:test yellow, :sandbox violet); real data shows none. Sidebar items mark themselves current with `current_page?` unless you pass `current:`; `with_heading` groups the items after it.

        Give `html` and `body` `height: 100%`. Below 760px wide, collapse or move the sidebar in your layout.
      example: app_shell
  slots:
    - [banner, "EnvBanner: text and kind (:test, :sandbox)"]
    - [sidebar, "brand, brand_href; with_item, with_heading, with_brand_logo, with_footer"]

- slug: page_header
  title: Page header
  group: Layout
  lead: Title row, filters row and tabs row, the same on every page.
  helper: |
    page_header(title:, subtitle: nil) do |header|
      header.with_action { … }   # one per action, primary last
      header.with_filters { … }  # search_input, multi_select, period_picker
      header.with_tabs(label:) do |tabs|
        tabs.with_tab(label, href: nil, count: nil, selected: false)
        tabs.with_action { … }
      end
    end
  sections:
    - text: Keep the same structure on every page so titles, actions and filters never move between views. The subtitle is one line of live context (last sync, today's date). Actions go right, secondary first and the primary last. Filters start with the search field; pickers follow at their natural width.
      example: page_header
  slots:
    - [action, "One per action (button, icon_button, popover…), in order"]
    - [filters, "The filters row: search_input, multi_select, period_picker"]
    - [tabs, "A tabs component: with_tab(label, href:, count:, selected:) and with_action"]

- slug: card
  title: Card
  group: Layout
  lead: A bordered panel that groups related content on a page.
  helper: |
    card(
      title: nil,
      subtitle: nil,
      flush: false  # no body padding, for tables
    ) do |c|
      c.with_action { … }
      c.with_footer { … }
      # body
    end
  sections:
    - text: "Use cards to group content on dashboards and detail pages, not around every block. `flush: true` removes the body padding so a table fills the card edge to edge. Trail UI added Card for Componeer; it is built only from existing tokens."
      example: card
  slots:
    - [action, "Items on the right of the header (pills, icon buttons)"]
    - [footer, "Right-aligned buttons under the body"]

- slug: tabs
  title: Tabs
  group: Layout
  lead: Subsets of the same records, each with its count.
  helper: |
    tabs(label:) do |t|
      t.with_tab(label, href: nil, count: nil, selected: false, panel: nil)
      t.with_action { … }
    end

    tab_panel(id:, selected: false) do
      # shown while the tab with panel: id is selected
    end
  sections:
    - text: |
        Tabs without `href:` switch on the page: give each one `panel:` with the id of a `tab_panel` and only the selected panel shows. Arrow keys move between tabs. They dispatch `componeer--tabs:change`.

        Tabs with `href:` are links, so each subset has its own URL (the usual choice for filtered lists, as in `page_header`'s tabs slot).
      example: tabs

- slug: multi_select
  title: Multi-select
  group: Pickers
  lead: Filter by several values of one dimension. Never pills, never a single select.
  helper: |
    multi_select(
      name:,
      label:,
      options:,                  # values or { value:, label:, sub:, status:, color: }
      selected: nil,             # nil = all
      icon: nil,
      all_label: "Todos",
      none_label: "Nenhum",
      many_label: "%{count} selecionados",
      searchable: nil,           # nil = more than 8 options
      search_placeholder: "Buscar",
      align: :left
    )
  sections:
    - text: |
        Options are values or hashes (`value`, `label`, optional `sub`, `status` or `color`). It submits `name[]` with the checked values; `selected: nil` means all. The summary on the trigger follows the choice: all, none, the one name, or `many_label` with `%{count}`. Search appears by itself above 8 options.

        It dispatches `componeer--multi-select:change` with the chosen values, so a form can submit itself: `data-action="componeer--multi-select:change->filters#submit"`.
      example: multi_select

- slug: period_picker
  title: Period picker
  group: Pickers
  lead: A date range from presets or two date fields.
  helper: |
    period_picker(
      from_name: :from,
      to_name: :to,
      from: nil,
      to: nil,
      presets: [],  # [{ label:, from:, to: }]
      title: "Período"
    )
  sections:
    - text: Presets are hashes with `label`, `from` and `to` (nil for an open end). Picking one fills both fields and closes the panel; editing a date clears the preset. It dispatches `componeer--period-picker:change`.
      example: period_picker

- slug: popover
  title: Popover
  group: Pickers
  lead: A trigger with a floating panel, for anything the other pickers do not cover.
  helper: |
    popover(align: :left) do |p|
      p.with_trigger { button … }
      # panel content
    end
  sections:
    - text: "The panel opens under the trigger and closes on Escape or a click outside. Use `align: :right` near the right edge."
      example: popover

- slug: table
  title: Table
  group: Data
  lead: Dense lists of records, declared column by column.
  helper: |
    table(
      rows:,
      row_href: nil,   # ->(row) { url }
      current: nil,    # ->(row) { true for the open row }
      group_by: nil,   # ->(row) { group label }
      collapsible: false,
      collapsed: [],   # group labels that start folded
      empty: "Nada por aqui.",
      min_width: nil
    ) do |t|
      t.column(header, align: :left, width: nil) { |row| … }
      t.empty { … }    # instead of empty:
    end
  sections:
    - heading: Simple
      text: Each `column` block receives the row and returns the cell (a value or ERB). Right-align money and quantities; numbers are tabular.
      example: table_simple
    - heading: Grouped, clickable, current row
      text: "`group_by` adds a header row per group with its count. `row_href` makes whole rows clickable without stealing clicks from links, buttons and checkboxes inside them. `current` marks the row whose drawer is open. `min_width` keeps columns readable: the table scrolls sideways inside its box."
      example: table_grouped
    - heading: Collapsible groups
      text: "With `collapsible: true` each group header becomes a button that folds its rows away (the chevron turns). `collapsed:` lists the groups that start folded. Each group is its own `<tbody>`, so folding works without moving rows around."
      example: table_collapsible
    - heading: Selection, status and row actions
      text: A column header can be any markup, like a select-all checkbox. Put row actions in a narrow right-aligned last column as icon buttons with labels that name the record.
      example: table_actions
    - heading: Without data
      text: "With no rows the table keeps its header, so it still reads as a table, and shows an empty state across the body. `empty:` takes a plain sentence (first card); `t.empty { … }` takes any markup, usually an `empty_state` with an icon, a description that names the filter and a way out (second card)."
      example: table_empty
    - heading: In a card, with pagination
      text: "`card(flush: true)` lets the table fill the card edge to edge; `pagination` goes in the card footer."
      example: table_card
  options:
    - [rows, "Any enumerable"]
    - [row_href, "Lambda row → URL; the row becomes a link"]
    - [current, "Lambda row → true for the row whose drawer is open"]
    - [group_by, "Lambda row → group label"]
    - [collapsible, "Group headers fold and unfold their rows"]
    - [collapsed, "Group labels that start folded"]
    - [empty, "Sentence shown when there are no rows (or use t.empty { … })"]
    - [min_width, "CSS width that keeps columns readable; the table scrolls inside its box"]

- slug: empty_state
  title: Empty state
  group: Data
  lead: Say what is empty in the list's own terms and offer the way out.
  helper: |
    empty_state(
      title = nil,
      description: nil,
      icon: nil,
      size: :md,        # or :sm
      bordered: false
    ) do |e|
      e.with_action { … }
    end
  sections:
    - heading: Just a sentence
      text: The smallest form, for places where the context already explains itself.
      example: empty_state
    - heading: Custom text and icon
      text: "The title says what is empty (\"Nenhuma quest concluída ainda\"), the description says why or what will fill it. Pick a Tabler icon for the thing that is missing, not a generic one. Any extra markup in the block goes under the description."
      example: empty_state_icon
    - heading: With actions
      text: "First use and filters that match nothing deserve a way out: one primary action, at most one secondary. `bordered: true` draws a dashed outline for an empty area inside a page."
      example: empty_state_action
    - heading: Small
      text: "`size: :sm` for cards and side panels."
      example: empty_state_small
  options:
    - [title, "What is empty, as a short sentence"]
    - [description, "Why it is empty or what will fill it"]
    - [icon, "Tabler icon of the missing thing, shown in a soft circle"]
    - [size, ":md (pages, tables) or :sm (cards, side panels)"]
    - [bordered, "Dashed outline for an empty area inside a page"]
  slots:
    - [action, "Buttons under the text; the first one primary"]

- slug: pagination
  title: Pagination
  group: Data
  lead: Page links for long lists.
  helper: |
    pagination(
      page:,
      pages:,
      url:,              # ->(page) { url }
      label: "Paginação"
    )
  sections:
    - text: "`url` is a lambda from a page number to its URL, so it works with any pagination source (`pagy`, `limit`/`offset`, your own). It shows the first and last pages and two pages around the current one; with a single page it renders nothing."
      example: pagination

- slug: code_block
  title: Code block
  group: Data
  lead: Source code with syntax colours and a copy button.
  helper: |
    code_block(
      source = nil,          # or the block's text
      language: :plaintext,  # any Rouge lexer: :ruby, :erb, :javascript, :css, :json, :sql…
      title: nil,
      copy: true,
      **html
    )
  sections:
    - text: |
        Highlighting runs on the server with Rouge, so it works without JavaScript and supports 200+ languages (`ruby`, `erb`, `javascript`, `html`, `css`, `json`, `yaml`, `sql`, `shell`…). The colours are Trail UI's `code-*` tokens. Pass the source as the first argument or as the block's text; the title defaults to the language name.
      example: code_block
  options:
    - [language, "Rouge lexer name or alias; unknown names fall back to plain text"]
    - [title, "Text on the bar above the code (a file name, for example)"]
    - [copy, "Show the copy button (default true)"]

- slug: drawer
  title: Drawer
  group: Overlays
  lead: A record's detail on the right edge, over the list it came from.
  helper: |
    drawer(title:, close_href: nil, eyebrow: nil) do |d|
      d.with_meta { … }
      d.with_action { … }
      d.with_section(title = nil) { … }
    end
  sections:
    - text: |
        Render it into a Turbo Frame next to the list so the list stays usable, and mark the list row `current`. Escape and the close button follow `close_href` (or remove the drawer when there is none).
      example: drawer
  slots:
    - [meta, "Status pill and a context line under the title"]
    - [action, "Small buttons under the meta"]
    - [section, "Body sections, each with an optional heading"]

- slug: modal
  title: Modal
  group: Overlays
  lead: A blocking dialog for confirmations and short forms.
  helper: |
    modal(title:, subtitle: nil, close_href: nil, width: "440px") do |m|
      # body
      m.with_footer { … }  # "Cancelar" first, confirm last
    end
  sections:
    - text: Footer buttons go "Cancelar" first, the confirming action last; a destructive confirm uses `danger_fill` and repeats the verb from the title.
      example: modal

- slug: toast
  title: Toast
  group: Overlays
  lead: A short confirmation after an action.
  helper: |
    toast(message, variant: :default, dismiss_after: 6000) do |t|
      t.with_action { … }
    end

    toasts(flash: nil)  # without a block, shows the flash
  sections:
    - text: "`toasts` without a block shows the flash (`notice` as a toast, `alert` as an error toast); put it once in the layout. Toasts leave after `dismiss_after` milliseconds (0 keeps them)."
      example: toast
