# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  Exclude:
    - "vendor/**/*"
    - "spec/dummy/bin/**/*"
    - "spec/dummy/tmp/**/*"

# Specs describe behaviour in describe/context; examples are one-liners without descriptions.
RSpec/MultipleMemoizedHelpers:
  Enabled: false
# Component specs render once in `before` and assert one thing per example.
RSpec/NestedGroups:
  Max: 4
# "Small components" groups several tiny component classes in one file.
RSpec/DescribeClass:
  Exclude:
    - "spec/components/componeer/small_components_spec.rb"
    - "spec/requests/**/*"
RSpec/MultipleDescribes:
  Exclude:
    - "spec/components/componeer/small_components_spec.rb"
RSpec/SpecFilePathFormat:
  Exclude:
    - "spec/components/componeer/small_components_spec.rb"

Layout/LineLength:
  Enabled: true
  Max: 100
  Exclude:
    # Rails-generated files of the test app: kept as the generator wrote them.
    - "spec/dummy/**/*"

# Private methods sit at the same indentation as the `private` keyword (owner's preference over
# omakase's indented_internal_methods).
Layout/IndentationConsistency:
  EnforcedStyle: normal
