services:
  - type: web
    name: componeer-docs
    runtime: ruby
    plan: free
    buildCommand: bin/render-build
    startCommand: bundle exec puma -b tcp://0.0.0.0:$PORT config.ru
    healthCheckPath: /componeer
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "0"
